<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VIBRATION</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #pcContent,
    #mobileAlert {
      display: none;
    }

    .card {
      padding: 25px 35px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- PC CONTENT -->
  <div id="pcContent">
    <div class="card bg-white">
      👋 Hi
    </div>
  </div>

  <!-- MOBILE ALERT -->
  <div id="mobileAlert">
    <div class="card border-danger text-danger bg-white">
      ❌ This page is only visible on PC or Laptop
    </div>
  </div>

<script>
  function isSmallScreen() {
    return window.innerWidth <= 1024;
  }

  function updateView() {
    if (isSmallScreen()) {
      document.getElementById("mobileAlert").style.display = "block";
      document.getElementById("pcContent").style.display = "none";
    } else {
      document.getElementById("pcContent").style.display = "block";
      document.getElementById("mobileAlert").style.display = "none";
    }
  }

  // Run on load
  updateView();

  // Run on resize (important for laptops)
  window.addEventListener("resize", updateView);
</script>


</body>
</html>
