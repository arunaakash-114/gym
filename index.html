<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Unlock 💕</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(135deg,#ff6a88,#ff99ac);
    font-family: 'Segoe UI', sans-serif;
    overflow:hidden;
}

/* Unlock Button */
.love-unlock-btn-2026{
    padding:16px 45px;
    font-size:20px;
    border:none;
    border-radius:60px;
    background:white;
    color:#e91e63;
    font-weight:bold;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    transition:0.4s;
    z-index:10;
}

.love-unlock-btn-2026:hover{
    transform:scale(1.05);
}

/* Effects */
.love-effects{
    position:fixed;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:hidden;
    z-index:5;
}

.heart, .balloon{
    position:absolute;
}

.heart{
    font-size:22px;
    animation:floatUp linear forwards;
}

.balloon{
    font-size:28px;
    animation:balloonRise linear forwards;
}

@keyframes floatUp{
    0%{transform:translateY(100vh) scale(0.6);opacity:1;}
    100%{transform:translateY(-10vh) scale(1.2);opacity:0;}
}

@keyframes balloonRise{
    0%{transform:translateY(100vh);opacity:1;}
    100%{transform:translateY(-10vh);opacity:0;}
}

.confetti{
    position:absolute;
    width:8px;
    height:8px;
    animation:confettiFall 3s linear forwards;
}

@keyframes confettiFall{
    0%{transform:translateY(-10px);opacity:1;}
    100%{transform:translateY(100vh);opacity:0;}
}

/* Envelope */
.love-envelope{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:220px;
    height:140px;
    background:#ff4d88;
    border-radius:10px;
    cursor:pointer;
    z-index:2000;
    animation:popIn 0.4s ease;
}

.love-envelope::before{
    content:"";
    position:absolute;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-bottom:70px solid #ff80aa;
    top:-70px;
    left:0;
    transition:0.6s;
}

.love-envelope.open::before{
    transform:rotateX(180deg);
    transform-origin:bottom;
}

@keyframes popIn{
    from{transform:translate(-50%,-50%) scale(0.7);opacity:0;}
    to{transform:translate(-50%,-50%) scale(1);opacity:1;}
}

/* Glass Modal */
.modal-content{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.3);
    color:white;
}

.love-close-btn{
    border-radius:30px;
    padding:8px 25px;
    background:#fff;
    color:#e91e63;
    font-weight:bold;
}

</style>
</head>
<body>

<button class="love-unlock-btn-2026" onclick="handleLoveUnlockClick()">
💝 Unlock My Surprise 💕
</button>

<div class="love-effects" id="loveEffects"></div>

<!-- Countdown Modal -->
<div class="modal fade" id="countdownModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content text-center p-4">
<h4>⏳ Our Special Moment Is Coming 💖</h4>
<h5>⏳ Surprise Unlocked at FEB 14 12.00 AM After💖</h5>
<h6>⏳ Kindly Wait for Magical Moments💖</h6>


<div id="countdownText" class="mt-3"></div>
<button class="btn love-close-btn mt-3" data-bs-dismiss="modal">Close 💕</button>
</div>
</div>
</div>

<!-- QR Modal -->
<div class="modal fade" id="qrModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content text-center p-4">
<h4>🎉 Surprise Unlocked 💖</h4>
<p>Scan Me or Click Below</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://arun12334.github.io/valentine-gifts/" class="img-fluid">

<a href="https://arun12334.github.io/valentine-gifts/" target="_blank" class="btn love-close-btn mt-3">
Open My Surprise 💕
</a>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

// 🔥 CHANGE THIS DATE FOR REAL USE
 
const loveUnlockDate2026 = new Date(2026, 1, 14, 0, 0, 0);


let countdownInterval;

function handleLoveUnlockClick(){
    const now = new Date();

    if(now >= loveUnlockDate2026){
        showEnvelope();
    }else{
        showCountdown();
    }
}

function showCountdown(){
    const modal = new bootstrap.Modal(document.getElementById('countdownModal'));
    modal.show();

    updateCountdown();
    clearInterval(countdownInterval);

    countdownInterval = setInterval(updateCountdown,1000);
}

function updateCountdown(){
    const now = new Date();
    const diff = loveUnlockDate2026 - now;

    if(diff <=0){
        document.getElementById("countdownText").innerHTML="💖 It's Time! Click Again 💖";
        clearInterval(countdownInterval);
        return;
    }

    const d=Math.floor(diff/(1000*60*60*24));
    const h=Math.floor((diff/(1000*60*60))%24);
    const m=Math.floor((diff/(1000*60))%60);
    const s=Math.floor((diff/1000)%60);

    document.getElementById("countdownText").innerHTML=
    `${d} Days ${h} Hours ${m} Minutes ${s} Seconds 💕`;
}

function showEnvelope(){

    if(document.querySelector(".love-envelope")) return;

    const envelope = document.createElement("div");
    envelope.classList.add("love-envelope");
    document.body.appendChild(envelope);

    // 🔥 AUTO OPEN AFTER 3 SECONDS
    setTimeout(() => {

        envelope.classList.add("open");

        // wait for open animation
        setTimeout(() => {
            envelope.remove();
            startEffects();
            showQrModal();
        }, 700);

    }, 3000); // 3 seconds delay
}


function showQrModal(){
    const modal = new bootstrap.Modal(document.getElementById('qrModal'));
    modal.show();
}

function startEffects(){
    const effects=document.getElementById("loveEffects");

    // Clear old effects
    effects.innerHTML = "";

    // Hearts
    for(let i=0;i<25;i++){
        let heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💖";
        heart.style.left=Math.random()*100+"vw";
        heart.style.animationDuration=(3+Math.random()*3)+"s";
        effects.appendChild(heart);
    }

    // Balloons
    for(let i=0;i<15;i++){
        let balloon=document.createElement("div");
        balloon.className="balloon";
        balloon.innerHTML="🎈";
        balloon.style.left=Math.random()*100+"vw";
        balloon.style.animationDuration=(5+Math.random()*4)+"s";
        effects.appendChild(balloon);
    }

    // Confetti
    for(let i=0;i<50;i++){
        let confetti=document.createElement("div");
        confetti.className="confetti";
        confetti.style.left=Math.random()*100+"vw";
        confetti.style.backgroundColor=`hsl(${Math.random()*360},100%,50%)`;
        effects.appendChild(confetti);
    }
}

</script>

</body>
</html>
