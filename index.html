<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Friendship Day 💛</title>

  <!-- Bootstrap CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .card-box {
      background: #fff;
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .hidden {
      display: none;
    }

    .btn-yes {
      background-color: #28a745;
      color: #fff;
    }

    .btn-no {
      position: absolute;
    }

    .stage {
      position: relative;
      height: 150px;
      margin-top: 30px;
    }

    h1 span {
      animation: pulse 1.5s infinite;
      display: inline-block;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<body>

<div class="card-box">

  <!-- Screen 1 -->
  <div id="startScreen">
    <h1>💛 Happy Friendship Day 💛</h1>
    <p class="mt-3">Click start for a small surprise 😄</p>
    <button class="btn btn-primary mt-3" onclick="start()">⭐ Start</button>
  </div>

  <!-- Screen 2 -->
  <div id="questionScreen" class="hidden">
    <h4>Do you accept my friendship request? 🤝💖</h4>

    <div class="stage">
      <button class="btn btn-yes px-4" onclick="yesClick()">YES 😊</button>
      <button class="btn btn-danger btn-no px-3" id="noBtn">NO 😈</button>
    </div>
  </div>

  <!-- Screen 3 -->
  <div id="resultScreen" class="hidden">
    <h2>🎉 Good Choice! 🎉</h2>
    <h4 class="mt-2">Forever Friends 💖♾️</h4>
    <p class="mt-3">Thank you for accepting my friendship 😄</p>
  </div>

</div>

<script>

  function start() {
    document.getElementById('startScreen').classList.add('hidden');
    document.getElementById('questionScreen').classList.remove('hidden');
  }

  function yesClick() {
    document.getElementById('questionScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');
  }
  const noBtn = document.getElementById('noBtn');
  const stage = document.querySelector('.stage');

  const escapeDistance = 80; // px → how close mouse can come

  const noTexts = [
    "pls don’t 😭",
    "try it 🤭",
    "i am pavam 🥺",
    "why like this 😢",
    "be nice 😇",
    "not fair 😤",
    "click YES da 😆"
  ];
  let textIndex = 0;

  stage.addEventListener('mousemove', (e) => {
    const btnRect = noBtn.getBoundingClientRect();
    const mouseX = e.clientX;
    const mouseY = e.clientY;

    const btnX = btnRect.left + btnRect.width / 2;
    const btnY = btnRect.top + btnRect.height / 2;

    const distance = Math.hypot(mouseX - btnX, mouseY - btnY);

    if (distance < escapeDistance) {
      moveNoButton();
    }
  });

  function moveNoButton() {
    const maxX = stage.clientWidth - noBtn.offsetWidth;
    const maxY = stage.clientHeight - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + 'px';
    noBtn.style.top = randomY + 'px';

    noBtn.innerText = noTexts[textIndex];
    textIndex = (textIndex + 1) % noTexts.length;
  }
</script>


</body>
</html>
